[project]
name = "entsearch"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "openai",
    "opensearch-py",
    "aws-bedrock-token-generator",
    "tqdm",
    "regex",
    # harness runtime deps
    "pydantic[email]",
    "tiktoken",
    "anthropic",
    "pyyaml",
    "python-dotenv",
    "qdrant-client",
    "torch>=2.11.0",
    "sentence-transformers>=6.1.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "datasketch>=2.0.0",
    "accelerate>=1.15.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]
demo = [
    "sse-starlette>=3.5",
    "starlette>=1.7",
    "uvicorn>=0.54",
]
app = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "sse-starlette>=3.5",
    "uvicorn>=0.54",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
]

[project.scripts]
entsearch-mcp = "entsearch.serve.server:main"
entsearch-demo = "entsearch.serve.demo:main"
orgbrain-search = "orgbrain.mcp_server:main"
orgbrain-api = "orgbrain.api:main"
orgbrain-models = "orgbrain.models_service:main"
orgbrain-index-redwood = "orgbrain.index_redwood:main"
orgbrain-worker = "orgbrain.worker:main"

[dependency-groups]
dev = [
    "pytest",
    "bm25s",
    "tabulate>=0.10.0",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entsearch", "src/orgbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
